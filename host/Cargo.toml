[package]
name = "directdesk-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "directdesk_host"
path = "src/lib.rs"

[[bin]]
name = "DirectDeskHost"
path = "src/main.rs"

[[bin]]
name = "capture_harness"
path = "src/bin/capture_harness.rs"
required-features = ["harness"]

# Transient SYSTEM-integrity worker the service spawns on the console desktop to
# click the UAC consent dialog the medium-integrity host cannot reach via UIPI.
[[bin]]
name = "DirectDeskUacInjector"
path = "src/bin/uac_injector.rs"

[features]
# The host UI needs eframe/egui unconditionally now, so they are plain
# dependencies. `harness` only gates the extra de-risk binary.
default = ["harness"]
harness = []

[dependencies]
directdesk-shared = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }

eframe = { workspace = true }
egui = { workspace = true }
tray-icon = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    # WASAPI system-audio loopback (`audio_capture`): the MMDeviceEnumerator
    # CLSID, IMMDeviceEnumerator::GetDefaultAudioEndpoint, IMMDevice, IAudioClient,
    # IAudioCaptureClient, IAudioRenderClient, WAVEFORMATEX/WAVEFORMATEXTENSIBLE
    # and the AUDCLNT_* flag and error constants all live here.
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # `IMMDevice::Activate` — the one call that turns an endpoint into an
    # IAudioClient — takes a `*const PROPVARIANT`, so its binding is generated
    # under `all(Win32_System_Com_StructuredStorage, Win32_System_Variant)`. Without
    # this feature the method is not merely unusable, it is compiled out of the
    # interface entirely and `audio_capture` cannot open a device at all.
    # (`Win32_System_Variant` is already below, for mf_encoder's ICodecAPI VARIANTs.)
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Variant",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tracing-subscriber = { workspace = true }
