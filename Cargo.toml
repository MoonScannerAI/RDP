[workspace]
resolver = "2"
members = ["shared", "host", "client", "service", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["DirectDesk"]

[workspace.dependencies]
directdesk-shared = { path = "shared" }

# async runtime
tokio = { version = "1", features = ["full"] }

# transport
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# crypto
ring = "0.17"
ed25519-dalek = { version = "2", features = ["rand_core"] }
spake2 = "0.4"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

# serialization
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# windows
windows = "0.62"
windows-service = "0.8"
winresource = "0.1"

# ui
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.35"
tray-icon = "0.21"

# misc
thiserror = "2"
anyhow = "1"
bytes = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
arraydeque = "0.5"
dirs = "6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "none"
