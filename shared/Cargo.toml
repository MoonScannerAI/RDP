[package]
name = "directdesk-shared"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
# TLS over tokio's TcpStream for the M4 fallback transport. rustls 0.23
# compatible; `ring` only — aws-lc-rs needs a C toolchain and a mixed-provider
# process is a source of very confusing runtime errors (see crypto::tls).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
ed25519-dalek = { workspace = true }
spake2 = { workspace = true, features = ["std"] }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
]

[dev-dependencies]
proptest = "1"
