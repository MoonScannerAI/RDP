[package]
name = "directdesk-shared"
version.workspace = true
edition.workspace = true
license.workspace = true

# ---------------------------------------------------------------------------
# Features: the parked modules
# ---------------------------------------------------------------------------
#
# Four sizeable modules in this crate are finished, tested, and selected by NO
# binary: the TCP/TLS fallback transport, the route racer, the NAT/STUN prober,
# and the deterministic network simulator. Together they are ~7100 lines that
# every product build of host.exe, client.exe and service.exe was compiling and
# linking so that nothing could call them. Each feature below parks one of
# them — off by default, so the shipped binaries stop paying for code that no
# code path can reach.
#
# THE GATE ON EACH MODULE MUST BE `#[cfg(any(feature = "...", test))]`,
# NEVER a bare `#[cfg(feature = "...")]`.
#
# Why the `test` disjunct is not decoration: rustc sets `cfg(test)` when this
# crate is compiled as its own test harness, which is exactly what
# `cargo test --workspace` does for `-p directdesk-shared`. With `test` inside
# the `any(...)`, each module and its `#[cfg(test)] mod tests` still compile and
# run under that harness, while every product build excludes them. We lose the
# code from the binaries and keep all ~105 of its tests.
#
# A bare feature gate would instead silently DELETE those ~105 tests from the
# default suite. Nothing would go red. `cargo test --workspace` would print a
# smaller number and pass — which is the worst failure mode a test suite has:
# it stops testing and does not tell you. That is why `shared/src/lib.rs`
# carries `#[cfg(test)] mod parked_modules`, a test that merely names one public
# item from each parked module. Tidy a gate down to a bare feature and that file
# stops COMPILING, so the suite fails loudly instead of quietly shrinking.
#
# `netsim` is the exception that proves the rule. The `directdesk-tests` crate
# consumes it as an ordinary dependency, and `cfg(test)` in *this* crate is not
# set when *another* crate builds it — so `tests/Cargo.toml` turns the feature
# on explicitly with `features = ["netsim"]`. Delete that and the integration
# harness fails to compile, which is loud enough on its own.
#
# One honest caveat about `netsim`, so nobody over-claims the win: cargo unifies
# features across workspace members built in a single invocation. Because
# `directdesk-tests` asks for `netsim`, a `cargo build --workspace --release`
# (which is what `tools/build-installer.ps1` runs) compiles `shared` ONCE with
# `netsim` on, and host/client/service link that rlib. The per-crate builds in
# `docs/BUILDING.md` — `cargo build -p directdesk-host --release` and friends —
# do not pull the tests crate in and so do get the smaller `shared`. The other
# three features are requested by no member at all, so they are genuinely off in
# every build either way.
#
# `tools/check.ps1` runs clippy with `--all-features` so the parked code stays
# linted rather than rotting out of sight.
[features]
default = []
# `transport::tcp` — the TLS-over-TCP fallback session (~2500 lines).
transport-tcp = []
# `transport::race` — staggered "happy eyeballs" route racing (~1250 lines).
transport-race = []
# `nettest` — the STUN client and the NAT/connectivity prober (~2200 lines).
nettest = []
# `netsim` — the deterministic network simulator (~1250 lines). Used only by
# `directdesk-tests`, which enables this feature in its own manifest.
netsim = []

[dependencies]
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
# TLS over tokio's TcpStream for the M4 fallback transport. rustls 0.23
# compatible; `ring` only — aws-lc-rs needs a C toolchain and a mixed-provider
# process is a source of very confusing runtime errors (see crypto::tls).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
ed25519-dalek = { workspace = true }
spake2 = { workspace = true, features = ["std"] }
rand = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
# Lossless static-region tiles (see `tiles`). Default features select the pure
# Rust `miniz_oxide` backend — no C toolchain, which this project deliberately
# avoids. Already resolved in Cargo.lock transitively via `png`, so this pins no
# new version and downloads nothing.
flate2 = "1.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
# Only used to size the UDP socket send/receive buffers before handing the
# socket to quinn. quinn's own `Endpoint::server`/`client` bind a socket with
# the OS default buffers (~64 KiB on Windows), which a fast video sender
# overruns on loopback — the kernel then drops datagrams silently. Already in
# the tree transitively via quinn-udp 0.5, so this pins no new version.
socket2 = "0.6"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    # For `winutil`: Threading gives CreateEventW/SetEvent/ResetEvent/
    # WaitForSingleObject, IO gives CancelIoEx/GetOverlappedResult/OVERLAPPED.
    # The host and service crates already carry both; these entries only matter
    # when `shared` is built or tested on its own.
    "Win32_System_Threading",
    "Win32_System_IO",
]

[dev-dependencies]
proptest = "1"
