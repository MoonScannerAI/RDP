[package]
name = "directdesk-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "directdesk_client"
path = "src/lib.rs"

[[bin]]
name = "DirectDeskClient"
path = "src/main.rs"

[dependencies]
directdesk-shared = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }

[dev-dependencies]
# The end-to-end loopback test stands up a real QUIC host endpoint (real TLS
# pinning, SPAKE2 pairing and mutual auth via directdesk-shared) and, when the
# capture stack is available, sources real H.264 frames from the host pipeline.
directdesk-host = { path = "../host", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Media_MediaFoundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # WASAPI playback (src/audio_render.rs): IMMDeviceEnumerator, IMMDevice,
    # IAudioClient, IAudioRenderClient, WAVEFORMATEX, eRender/eConsole and the
    # AUDCLNT_* constants all live here.
    "Win32_Media_Audio",
    # Both of these exist for exactly one call: `IMMDevice::Activate`, which is
    # `#[cfg(all(feature = "Win32_System_Com_StructuredStorage", feature =
    # "Win32_System_Variant"))]` in the bindings because its pActivationParams
    # argument is a PROPVARIANT. With either one missing the method does not
    # exist at all (the vtable slot degrades to `usize`), so there is no way to
    # reach an IAudioClient. Neither feature is used for anything else.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
